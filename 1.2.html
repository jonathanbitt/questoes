        .header {

        .header h1 {

        .header p {

        }

        /* Seção de Revisões Pendentes */
        .reviews-section {

            box-shadow: 0 0 20px rgba(229,9,20,0.3);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(229,9,20,0.4); }

        .reviews-header {
            display: flex;

            gap: 15px;
        }

        .reviews-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #e50914;
        }

        .reviews-badge {
            background: #e50914;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
        }

        .reviews-carousel {
            display: flex;

            overflow-x: auto;
            padding: 10px 5px;

        .reviews-carousel::-webkit-scrollbar {

        }

        .review-card {
            min-width: 240px;

            display: inline-block;

            border-radius: 40px;

            color: white;

        .button-group {

            flex-wrap: wrap;
            gap: 16px;
            margin: 25px 0 15px;

        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 40px;
            font-weight: bold;

            font-size: 0.9rem;

        }

        .btn-review {

            background: #e68900;

        .btn-success {
            background: #2e7d32;
        }

        }

        .btn-secondary {
            background: #2c2c2c;
            border: 1px solid #555;
        }

        .btn-secondary:hover {
            background: #444;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: #777;
        }
    </style>
</head>

    const descricoesFrances = [
        "Aprenda o alfabeto francês e a pronúncia correta das vogais. Fundamentos essenciais para começar sua jornada no francês.",
        "Domine a técnica do 'U' francês, um dos sons mais característicos e desafiadores para falantes de português.",

        "Domine o 'E' aberto (è) e suas variações regionais no francês falado.",

    ];

    let sections = [
        {
            id: "frances",
            title: "🇫🇷 Curso de Pronúncia - Francês com a Marie",

        }
    ];

    let videoProgress = new Map();

function gerarVideosFrances() {
    const videos = [

        },
        {
            id: "frances_aula2",
            title: "1.2 - Técnica do U",
            description: "Domine a técnica do 'U' francês, um dos sons mais característicos e desafiadores para falantes de português.",

        },
        {
            id: "frances_aula3",
            title: "1.3 - Segredo da Língua",

            description: "Diferença crucial entre os sons de 'U' e 'OU' em francês. Exercícios práticos de discriminação auditiva.",
            youtubeId: "SEU_ID_AULA_4",
            telegramLink: "https://t.me/francescomamarie/aula4"
        },
        {
            id: "frances_aula5",
            title: "1.5 - E mudo",
            description: "Entenda quando o 'E' é mudo em francês e como isso afeta a fluência da fala.",
            youtubeId: "SEU_ID_AULA_5",
            telegramLink: "https://t.me/francescomamarie/aula5"
        },
        {
            id: "frances_aula6",
            title: "1.6 - E fechado",
            description: "Aprenda a pronunciar o 'E' fechado (é) em diferentes contextos da língua francesa.",
            youtubeId: "SEU_ID_AULA_6",
            telegramLink: "https://t.me/francescomamarie/aula6"
        },
        {
            id: "frances_aula7",
            title: "1.7 - E aberto",
            description: "Domine o 'E' aberto (è) e suas variações regionais no francês falado.",
            youtubeId: "SEU_ID_AULA_7",
            telegramLink: "https://t.me/francescomamarie/aula7"
        },
        {

            description: "Guia completo dos acentos franceses: aigu, grave, circonflexe, tréma e cédille.",
            youtubeId: "SEU_ID_AULA_8",

        {

            description: "Revisão de todos os sons aprendidos até agora. Exercícios de fixação e avaliação.",

        }

}

    function initVideoProgress(videoId) {
        if (!videoProgress.has(videoId)) {
            videoProgress.set(videoId, {
                status: "not_studied",
                reviewCount: 0,
                lastReviewDate: null,
                nextReviewDate: null,
                completedRevisions: []
            });
        }
        return videoProgress.get(videoId);
    }

    function calculateNextReviewDate(reviewCount) {
        if (reviewCount >= MAX_REVISIONS) return null;
        const daysToAdd = REVISION_INTERVALS[reviewCount];
        const nextDate = new Date();
        nextDate.setDate(nextDate.getDate() + daysToAdd);
        return nextDate;
    }

    async function markAsStudied(videoId, isRevision = false) {
        const progress = initVideoProgress(videoId);
        const now = new Date();
        
        if (!isRevision && progress.status === "not_studied") {
            progress.status = "studied";
            progress.reviewCount = 0;
            progress.lastReviewDate = now;
            progress.nextReviewDate = calculateNextReviewDate(0);
            progress.completedRevisions = [];
        } else if (isRevision && progress.reviewCount < MAX_REVISIONS) {
            progress.reviewCount++;
            progress.lastReviewDate = now;
            progress.completedRevisions.push(now);
            
            if (progress.reviewCount >= MAX_REVISIONS) {
                progress.nextReviewDate = null;
                progress.status = "completed";
            } else {
                progress.nextReviewDate = calculateNextReviewDate(progress.reviewCount);
                progress.status = "reviewing";
            }
        }
        
        await saveProgressToFirebase();
        renderAll();
    }

    async function markAsCompleted(videoId) {
        const progress = initVideoProgress(videoId);
        const now = new Date();
        
        progress.status = "completed";
        progress.reviewCount = MAX_REVISIONS;
        progress.lastReviewDate = now;
        progress.nextReviewDate = null;
        
        while (progress.completedRevisions.length < MAX_REVISIONS) {
            progress.completedRevisions.push(now);
        }
        
        await saveProgressToFirebase();
        renderAll();
    }

    function getVideosNeedingReview() {
        const now = new Date();
        now.setHours(0, 0, 0, 0);
        
        const needReview = [];
        
        for (let section of sections) {
            for (let video of section.videos) {
                const progress = initVideoProgress(video.id);
                
                if (progress.nextReviewDate && progress.reviewCount < MAX_REVISIONS) {
                    const reviewDate = new Date(progress.nextReviewDate);
                    reviewDate.setHours(0, 0, 0, 0);
                    
                    if (reviewDate <= now) {
                        needReview.push({
                            ...video,
                            sectionId: section.id,
                            reviewNumber: progress.reviewCount + 1,
                            currentReview: progress.reviewCount,
                            nextReviewDays: REVISION_INTERVALS[progress.reviewCount]
                        });
                    }
                }
            }
        }
        
        needReview.sort((a, b) => {
            const progA = videoProgress.get(a.id);
            const progB = videoProgress.get(b.id);
            return new Date(progA.nextReviewDate) - new Date(progB.nextReviewDate);
        });
        
        return needReview;
    }

    function renderReviewsSection() {
        const needReview = getVideosNeedingReview();
        const container = document.getElementById('reviewsSection');
        
        if (needReview.length === 0) {
            container.innerHTML = '';
            return;
        }
        
        container.innerHTML = `
            <div class="reviews-section">
                <div class="reviews-header">
                    <div class="reviews-title">
                        🔄 Revisões Pendentes - Francês com a Marie
                    </div>
                    <div class="reviews-badge">
                        ${needReview.length} aula(s) para revisar
                    </div>
                </div>
                <div class="reviews-carousel">
                    ${needReview.map(video => `
                        <div class="review-card" onclick="openVideoDetailsWithReview('${video.id}', true)">
                            <div class="review-number">
                                🔁 Revisão #${video.reviewNumber} / ${MAX_REVISIONS}
                            </div>
                            <div class="review-title">${escapeHtml(video.title)}</div>
                            <div class="review-due">
                                📅 Próxima revisão: ${video.nextReviewDays} dias
                            </div>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
    }

    function renderCarousels() {
        const container = document.getElementById('carouselsContainer');
        if (!container) return;
        container.innerHTML = '';
        
        sections.forEach(section => {
            let studied = 0;
            
            section.videos.forEach(video => {
                const progress = initVideoProgress(video.id);
                if (progress.status === "studied" || progress.status === "completed") studied++;
            });
            
            const total = section.videos.length;
            const percent = Math.round((studied / total) * 100);
            
            const sectionDiv = document.createElement('div');
            sectionDiv.className = 'carousel-section';
            sectionDiv.innerHTML = `
                <div class="carousel-container">
                    <div class="carousel-title">
                        <h2>${section.title}</h2>
                        <span class="section-progress">📊 Progresso: ${studied}/${total} (${percent}%)</span>
                    </div>
                    <div class="carousel-wrapper">
                        <div class="carousel" id="carousel-${section.id}"></div>
                    </div>
                </div>
            `;
            container.appendChild(sectionDiv);
            
            const carouselContainer = document.getElementById(`carousel-${section.id}`);
            if (carouselContainer) {
                section.videos.forEach(video => {
                    const progress = initVideoProgress(video.id);
                    let statusLabel = "";
                    let statusClass = "";
                    
                    if (progress.status === "studied") {
                        statusLabel = "✅ Estudado";
                        statusClass = "status-studied";
                    } else if (progress.status === "reviewing") {
                        statusLabel = `🔄 Revisão ${progress.reviewCount + 1}/${MAX_REVISIONS}`;
                        statusClass = "status-review";
                    } else if (progress.status === "completed") {
                        statusLabel = "🏆 Completo (10 revisões)";
                        statusClass = "status-studied";
                    } else {
                        statusLabel = "📚 Não Estudado";
                        statusClass = "status-not-studied";
                    }
                    
                    const card = document.createElement('div');
                    card.className = 'video-card';
                    card.innerHTML = `
                        <div class="thumbnail">
                            <span>🎬</span>
                            ${progress.reviewCount > 0 ? `<div class="review-counter">🔄 ${progress.reviewCount}/${MAX_REVISIONS}</div>` : ''}
                        </div>
                        <div class="video-title">${escapeHtml(video.title)}</div>
                        <div class="status-badge ${statusClass}">${statusLabel}</div>
                    `;
                    card.addEventListener('click', () => openVideoDetails(video.id, false));
                    carouselContainer.appendChild(card);
                });
            }
        });
        
        document.querySelectorAll('.carousel-wrapper').forEach(wrapper => {
            let isDown = false;
            let startX, scrollLeft;
            
            wrapper.addEventListener('mousedown', (e) => {
                isDown = true;
                startX = e.pageX - wrapper.offsetLeft;
                scrollLeft = wrapper.scrollLeft;
                wrapper.style.cursor = 'grabbing';
            });
            wrapper.addEventListener('mouseleave', () => {
                isDown = false;
                wrapper.style.cursor = 'grab';
            });
            wrapper.addEventListener('mouseup', () => {
                isDown = false;
                wrapper.style.cursor = 'grab';
            });
            wrapper.addEventListener('mousemove', (e) => {
                if (!isDown) return;
                e.preventDefault();
                const x = e.pageX - wrapper.offsetLeft;
                const walk = (x - startX) * 1.5;
                wrapper.scrollLeft = scrollLeft - walk;
            });
            wrapper.style.cursor = 'grab';
        });
    }

    let currentModal = null;
    
    window.openVideoDetailsWithReview = function(videoId, isRevision) {
        openVideoDetails(videoId, isRevision);
    };
    
    function openVideoDetails(videoId, isRevisionMode = false) {
        let video = null;
        for (let section of sections) {
            const found = section.videos.find(v => v.id === videoId);
            if (found) {
                video = found;
                break;
            }
        }
        if (!video) return;
        
        const progress = initVideoProgress(video.id);
        
        if (currentModal) currentModal.remove();
        
        const embedUrl = `https://www.youtube.com/embed/${video.youtubeId}?autoplay=0&rel=0`;
        const isReviewNeeded = isRevisionMode || (progress.nextReviewDate && new Date() >= new Date(progress.nextReviewDate));
        
        let statusMessage = "";
        if (progress.status === "completed") {
            statusMessage = "🏆 Aula completamente revisada! (10/10 revisões) - Parabéns! 🇫🇷";
        } else if (progress.status === "studied" && progress.reviewCount === 0) {
            statusMessage = "✅ Aula estudada. Aguardando primeira revisão em 1 dia...";
        } else if (progress.status === "reviewing") {
            statusMessage = `🔄 Revisão ${progress.reviewCount} de ${MAX_REVISIONS} concluída. Próxima revisão em ${REVISION_INTERVALS[progress.reviewCount]} dias.`;
        } else if (progress.status === "not_studied") {
            statusMessage = "📚 Aula ainda não estudada. Comece agora sua jornada no francês!";
        }
        
        const modal = document.createElement('div');
        modal.className = 'details-overlay';
        modal.innerHTML = `
            <div class="details-container">
                <h2>🇫🇷 ${escapeHtml(video.title)}</h2>
                
                ${progress.reviewCount > 0 || progress.status === "completed" ? `
                    <div class="review-info">
                        <div class="review-count">🔄 Revisões: ${progress.reviewCount} / ${MAX_REVISIONS}</div>
                        <div>${statusMessage}</div>
                    </div>
                ` : ''}
                
                <div class="video-description">
                    <strong>📝 Sobre esta aula:</strong>
                    ${escapeHtml(video.description)}
                </div>
                <div class="video-embed">
                    <iframe src="${embedUrl}" allowfullscreen loading="lazy"></iframe>
                </div>
                <div>
                    <a href="${video.telegramLink}" target="_blank" class="telegram-link">📱 Grupo no Telegram - Francês com a Marie</a>
                </div>
                <div class="button-group">
                    <button class="btn btn-secondary" id="backBtn">⬅ Voltar ao Carrossel</button>
                    
                    ${progress.status === "completed" ? 
                        `<button class="btn btn-success" disabled>🏆 Completo (10 revisões)</button>` :
                        (progress.status === "not_studied" ? 
                            `<button class="btn btn-primary" id="studyBtn">📌 Marcar como Estudado</button>` : 
                            (isReviewNeeded && progress.reviewCount < MAX_REVISIONS ? 
                                `<button class="btn btn-review" id="reviewBtn">🔄 Concluir Revisão #${progress.reviewCount + 1}</button>` : 
                                (progress.reviewCount < MAX_REVISIONS ?
                                    `<button class="btn btn-primary" id="reviewBtn">📖 Revisar Antecipadamente</button>` :
                                    ``
                                )
                            )
                        )
                    }
                    
                    ${progress.status !== "completed" ? 
                        `<button class="btn btn-success" id="completeBtn">🏁 Marcar como Concluído (Todas revisões)</button>` : 
                        ``
                    }
                </div>
            </div>
        `;
        
        document.body.appendChild(modal);
        currentModal = modal;
        
        modal.addEventListener('click', (e) => {
            if (e.target === modal) modal.remove();
        });
        
        document.getElementById('backBtn').addEventListener('click', () => modal.remove());
        
        const studyBtn = document.getElementById('studyBtn');
        const reviewBtn = document.getElementById('reviewBtn');
        const completeBtn = document.getElementById('completeBtn');
        
        if (studyBtn) {
            studyBtn.addEventListener('click', async () => {
                await markAsStudied(video.id, false);
                modal.remove();
            });
        }
        
        if (reviewBtn) {
            reviewBtn.addEventListener('click', async () => {
                await markAsStudied(video.id, true);
                modal.remove();
            });
        }
        
        if (completeBtn) {
            completeBtn.addEventListener('click', async () => {
                if (confirm(`Tem certeza que deseja marcar "${video.title}" como completamente concluído?\n\nIsso irá marcar todas as ${MAX_REVISIONS} revisões como concluídas.`)) {
                    await markAsCompleted(video.id);
                    modal.remove();
                }
            });
        }
    }
    
    async function saveProgressToFirebase() {
        const data = {};
        for (let [id, progress] of videoProgress.entries()) {
            data[id] = progress;
        }
        
        if (!useMock && db) {
            try {
                await db.collection("videoReviews").doc("progress").set(data, { merge: true });
            } catch (err) {
                console.warn("Erro ao salvar:", err);
                localStorage.setItem("reviews_progress_mock", JSON.stringify(data));
            }
        } else {
            localStorage.setItem("reviews_progress_mock", JSON.stringify(data));
        }
    }
    
    async function loadProgress() {
        if (!useMock && db) {
            try {
                const doc = await db.collection("videoReviews").doc("progress").get();
                if (doc.exists) {
                    const data = doc.data();
                    for (let [id, prog] of Object.entries(data)) {
                        if (prog.lastReviewDate) prog.lastReviewDate = new Date(prog.lastReviewDate);
                        if (prog.nextReviewDate) prog.nextReviewDate = new Date(prog.nextReviewDate);
                        if (prog.completedRevisions) {
                            prog.completedRevisions = prog.completedRevisions.map(d => new Date(d));
                        }
                        videoProgress.set(id, prog);
                    }
                }
            } catch (err) {
                console.warn("Erro ao carregar:", err);
                loadLocalMock();
            }
        } else {
            loadLocalMock();
        }
        
        for (let section of sections) {
            for (let video of section.videos) {
                initVideoProgress(video.id);
            }
        }
        
        renderAll();
    }
    
    function loadLocalMock() {
        const saved = localStorage.getItem("reviews_progress_mock");
        if (saved) {
            const data = JSON.parse(saved);
            for (let [id, prog] of Object.entries(data)) {
                if (prog.lastReviewDate) prog.lastReviewDate = new Date(prog.lastReviewDate);
                if (prog.nextReviewDate) prog.nextReviewDate = new Date(prog.nextReviewDate);
                videoProgress.set(id, prog);
            }
        }
    }
    
    function renderAll() {
        renderReviewsSection();
        renderCarousels();
    }
    
    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if(m === '&') return '&amp;';
            if(m === '<') return '&lt;';
            if(m === '>') return '&gt;';
            return m;
        });
    }
    
    function subscribeRealtime() {
        if (!useMock && db) {
            db.collection("videoReviews").doc("progress").onSnapshot((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    for (let [id, prog] of Object.entries(data)) {
                        if (prog.lastReviewDate) prog.lastReviewDate = new Date(prog.lastReviewDate);
                        if (prog.nextReviewDate) prog.nextReviewDate = new Date(prog.nextReviewDate);
                        videoProgress.set(id, prog);
                    }
                    renderAll();
                }
            });
        }
    }
    
    loadProgress().then(() => {
        subscribeRealtime();
    });
</script>
